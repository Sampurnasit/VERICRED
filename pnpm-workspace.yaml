packages:
  - "apps/*"
  - "packages/*"
  - "blockchain"
  - "zk"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  blake-hash: true
  esbuild: true
  keccak: true
  prisma: true
  secp256k1: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "argon2"
  - "blake-hash"
  - "esbuild"
  - "keccak"
  - "prisma"
  - "secp256k1"
