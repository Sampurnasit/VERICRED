services:
  postgres:
    image: postgres:16-alpine
    container_name: vericred-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-vericred_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vericred-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
